services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clawhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 first}
      POSTGRES_DB: clawhub_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawhub -d clawhub_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run setup.ps1 first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run setup.ps1 first}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  minio-init:
    image: minio/mc:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
      mc mb --ignore-existing local/clawhub-test
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run setup.ps1 first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run setup.ps1 first}
    depends_on:
      minio:
        condition: service_started

  pre-migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 first}
    volumes:
      - ./pre-base.sql:/sql/pre-base.sql:ro
    command: ["psql", "-h", "postgres", "-U", "clawhub", "-d", "clawhub_test", "-v", "ON_ERROR_STOP=1", "-f", "/sql/pre-base.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        GO_IMAGE: golang:1.25-alpine
        ALPINE_IMAGE: alpine:3.22
        APK_MIRROR: dl-cdn.alpinelinux.org
        GOPROXY: https://proxy.golang.org,direct
    image: yclawhub-windows-test-backend:local
    restart: "no"
    entrypoint: ["/app/backend/clawhub-migrate"]
    command: ["up"]
    environment:
      GO_ENV: dev
      PORT: "8080"
      DATABASE_URL: postgres://clawhub:${POSTGRES_PASSWORD:?Run setup.ps1 first}@postgres:5432/clawhub_test?sslmode=disable
    depends_on:
      pre-migrate:
        condition: service_completed_successfully

  schema-upgrade:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      for file in /sql/*/upgrade.sql; do
        psql -h postgres -U clawhub -d clawhub_test -v ON_ERROR_STOP=1 -f "$$file"
      done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 first}
    volumes:
      - ../../backend/data/sql:/sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    image: yclawhub-windows-test-backend:local
    restart: unless-stopped
    environment:
      GO_ENV: dev
      PORT: "8080"
      DATABASE_URL: postgres://clawhub:${POSTGRES_PASSWORD:?Run setup.ps1 first}@postgres:5432/clawhub_test?sslmode=disable
      OSS_ENDPOINT: http://minio:9000
      OSS_BUCKET: clawhub-test
      OSS_REGION: us-east-1
      OSS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Run setup.ps1 first}
      OSS_ACCESS_KEY_SECRET: ${MINIO_ROOT_PASSWORD:?Run setup.ps1 first}
      OSS_USE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:?Run setup.ps1 first}
      FRONTEND_URL: http://localhost:13000
      FEISHU_ENABLED: "false"
      GITHUB_ENABLED: "false"
    depends_on:
      schema-upgrade:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      args:
        BUN_IMAGE: oven/bun:1.3.6
        FRONTEND_ENV_FILE: .env.windows-test
        FRONTEND_BUILD_SCRIPT: build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: http://backend:8080
      VITE_SITE_URL: http://localhost:13000
      VITE_API_ORIGIN: http://localhost:18080
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:13000:3000"

volumes:
  pgdata:
  miniodata:
